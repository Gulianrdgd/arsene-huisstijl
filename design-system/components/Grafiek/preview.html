<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><title>Grafiek</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><style>body{margin:0;padding:24px;}</style></head>
<body class="ar">
<div style="display:grid;gap:48px;max-width:760px">

  <figure class="ar-chart" data-chart="bar">
    <figcaption><div class="ar-chart__title">Uren per maand, 2026</div><div class="ar-meta">Voorbeelddata. Juni uitgelicht, de rest ter vergelijking.</div></figcaption>
    <svg class="ar-chart__plot" role="img" aria-label="Staafdiagram: uren per maand, januari tot juni 2026. Juni is het hoogst met 164 uur."></svg>
    <details class="ar-chart__table"><summary>Toon als tabel</summary><table></table></details>
  </figure>

  <figure class="ar-chart" data-chart="line">
    <figcaption><div class="ar-chart__title">Openstaande tickets per week</div><div class="ar-meta">Voorbeelddata, drie klanten.</div></figcaption>
    <div class="ar-chart__legend"></div>
    <svg class="ar-chart__plot" role="img" aria-label="Lijndiagram: openstaande tickets per week voor drie klanten, week 1 tot 8."></svg>
    <details class="ar-chart__table"><summary>Toon als tabel</summary><table></table></details>
  </figure>

</div>
<div class="ar-chart__tip" hidden></div>

<script>
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
const tip = document.querySelector('.ar-chart__tip');
const showTip = (evt, html) => { tip.innerHTML = html; tip.hidden = false; tip.style.left = evt.clientX + 14 + 'px'; tip.style.top = evt.clientY + 14 + 'px'; };
const hideTip = () => { tip.hidden = true; };
// Round axis: a step of 1, 2, 2.5 or 5 x 10^n, about five ticks.
const scale = (max, target = 5) => { const raw = max / target, mag = Math.pow(10, Math.floor(Math.log10(raw))); const step = [1, 2, 2.5, 5, 10].find((s) => s * mag >= raw) * mag; const ticks = Math.ceil(max / step); return { max: ticks * step, ticks }; };

function table(fig, head, rows) {
  fig.querySelector('table').innerHTML = '<thead><tr>' + head.map((h) => `<th>${h}</th>`).join('') + '</tr></thead><tbody>' +
    rows.map((r) => '<tr>' + r.map((c, i) => i ? `<td class="num">${c}</td>` : `<th scope="row">${c}</th>`).join('') + '</tr>').join('') + '</tbody>';
}

function axes(svg, W, H, m, max, ticks) {
  for (let i = 0; i <= ticks; i++) {
    const v = (max / ticks) * i, y = H - m.b - (v / max) * (H - m.t - m.b);
    el('line', { x1: m.l, x2: W - m.r, y1: y, y2: y, class: 'grid' }, svg);
    el('text', { x: m.l - 8, y: y + 4, 'text-anchor': 'end', class: 'tick' }, svg).textContent = v.toLocaleString('nl-NL');
  }
}

function bar(fig) {
  const data = [['jan', 118], ['feb', 126], ['mrt', 141], ['apr', 122], ['mei', 137], ['jun', 164]];
  const hi = 'jun';
  const svg = fig.querySelector('svg'), W = 760, H = 260, m = { t: 24, r: 8, b: 28, l: 40 };
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const { max, ticks } = scale(Math.max(...data.map((d) => d[1])), 4);
  axes(svg, W, H, m, max, ticks);
  const band = (W - m.l - m.r) / data.length, bw = Math.min(24, band * 0.5), r = 4;
  data.forEach(([k, v], i) => {
    const x = m.l + band * i + (band - bw) / 2, h = (v / max) * (H - m.t - m.b), y = H - m.b - h;
    const fill = k === hi ? 'var(--chart-1)' : 'var(--chart-context)';
    el('path', { d: `M${x},${H - m.b}V${y + r}Q${x},${y} ${x + r},${y}H${x + bw - r}Q${x + bw},${y} ${x + bw},${y + r}V${H - m.b}Z`, fill }, svg);
    const hit = el('rect', { x: m.l + band * i, y: m.t, width: band, height: H - m.t - m.b, fill: 'transparent' }, svg);
    hit.addEventListener('mousemove', (e) => showTip(e, `<b>${k} 2026</b><br>${v} uur`));
    hit.addEventListener('mouseleave', hideTip);
    el('text', { x: x + bw / 2, y: H - m.b + 18, 'text-anchor': 'middle', class: 'tick' }, svg).textContent = k;
    if (k === hi) el('text', { x: x + bw / 2, y: y - 8, 'text-anchor': 'middle', class: 'value' }, svg).textContent = v;
  });
  table(fig, ['Maand', 'Uren'], data);
}

function line(fig) {
  const weeks = [1, 2, 3, 4, 5, 6, 7, 8];
  const series = [
    { name: 'Klant A', color: 'var(--chart-1)', v: [42, 38, 35, 31, 28, 24, 21, 18] },
    { name: 'Klant B', color: 'var(--chart-2)', v: [20, 24, 23, 27, 30, 29, 33, 35] },
    { name: 'Klant C', color: 'var(--chart-3)', v: [12, 13, 11, 12, 10, 11, 9, 8] }
  ];
  fig.querySelector('.ar-chart__legend').innerHTML = series.map((s) => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join('');
  const svg = fig.querySelector('svg'), W = 760, H = 280, m = { t: 16, r: 72, b: 28, l: 40 };
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const { max, ticks } = scale(Math.max(...series.flatMap((s) => s.v)));
  axes(svg, W, H, m, max, ticks);
  const X = (i) => m.l + (i / (weeks.length - 1)) * (W - m.l - m.r), Y = (v) => H - m.b - (v / max) * (H - m.t - m.b);
  weeks.forEach((w, i) => { el('text', { x: X(i), y: H - m.b + 18, 'text-anchor': 'middle', class: 'tick' }, svg).textContent = 'wk ' + w; });
  for (const s of series) {
    el('polyline', { points: s.v.map((v, i) => `${X(i)},${Y(v)}`).join(' '), fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);
    const last = s.v.length - 1;
    el('circle', { cx: X(last), cy: Y(s.v[last]), r: 4, fill: s.color, stroke: 'var(--web-background)', 'stroke-width': 2 }, svg);
    el('text', { x: X(last) + 10, y: Y(s.v[last]) + 4, class: 'label' }, svg).textContent = `${s.name} ${s.v[last]}`;
  }
  const cross = el('line', { y1: m.t, y2: H - m.b, class: 'cross', visibility: 'hidden' }, svg);
  const hit = el('rect', { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: 'transparent' }, svg);
  hit.addEventListener('mousemove', (e) => {
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const loc = p.matrixTransform(svg.getScreenCTM().inverse());
    const i = Math.max(0, Math.min(weeks.length - 1, Math.round(((loc.x - m.l) / (W - m.l - m.r)) * (weeks.length - 1))));
    cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('visibility', 'visible');
    showTip(e, `<b>Week ${weeks[i]}</b><br>` + series.map((s) => `<i style="background:${s.color}"></i>${s.name}: ${s.v[i]}`).join('<br>'));
  });
  hit.addEventListener('mouseleave', () => { hideTip(); cross.setAttribute('visibility', 'hidden'); });
  table(fig, ['Week', ...series.map((s) => s.name)], weeks.map((w, i) => [w, ...series.map((s) => s.v[i])]));
}

document.querySelectorAll('.ar-chart').forEach((fig) => (fig.dataset.chart === 'bar' ? bar : line)(fig));
</script>
</body>
</html>
